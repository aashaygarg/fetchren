name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.7
  # The Dart SDK bundled with FLUTTER_VERSION.
  DART_VERSION: 3.13.5

defaults:
  run:
    shell: bash

jobs:
  # Pure-Dart packages, including the SQLite repository, contract suite,
  # migration, and multi-process tests. Executes native SQLite on each runner.
  storage:
    name: storage (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest # Linux x64
          - ubuntu-24.04-arm # Linux arm64
          - windows-latest # Windows x64
          - macos-latest # macOS arm64
          - macos-15-intel # macOS x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Pure Dart: setup-dart also provides Linux arm64, which flutter-action
      # does not.
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_VERSION }}
      - name: fetchren_core
        working-directory: packages/fetchren_core
        run: dart pub get && dart analyze --fatal-infos && dart test
      - name: fetchren_core_testing
        working-directory: packages/fetchren_core_testing
        run: dart pub get && dart analyze --fatal-infos
      - name: fetchren_storage_sqlite
        working-directory: packages/fetchren_storage_sqlite
        run: dart pub get && dart analyze --fatal-infos && dart test

  # Flutter app: format, analysis, and unit/widget tests (headless).
  app-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: flutter pub get
      # flutter analyze also scans packages/, whose test dependencies must be
      # resolved first.
      - name: Resolve local packages
        run: for p in packages/*/; do (cd "$p" && dart pub get); done
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test

  # Desktop builds plus an on-device SQLite smoke test on each OS.
  # Linux and Windows runners are not committed yet; they are generated here
  # only for verification.
  desktop:
    name: desktop (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-latest
          - platform: linux
            os: ubuntu-latest
          - platform: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev xvfb
      - name: Generate platform runner (verification only)
        if: matrix.platform != 'macos'
        run: flutter create --platforms=${{ matrix.platform }} --org dev.fetchren .
      - run: flutter build ${{ matrix.platform }} --release
      - name: SQLite smoke test on device
        run: |
          if [ "${{ matrix.platform }}" = linux ]; then
            xvfb-run -a flutter test integration_test/sqlite_smoke_test.dart -d linux
          else
            flutter test integration_test/sqlite_smoke_test.dart -d ${{ matrix.platform }}
          fi

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Generate Android runner (verification only)
        run: flutter create --platforms=android --org dev.fetchren .
      - run: flutter build apk --debug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: SQLite smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: flutter test integration_test/sqlite_smoke_test.dart -d emulator-5554

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Generate iOS runner (verification only)
        run: flutter create --platforms=ios --org dev.fetchren .
      - run: flutter build ios --simulator --no-codesign
      - name: SQLite smoke test on simulator
        # A hung simulator otherwise runs until the 6-hour job limit.
        timeout-minutes: 20
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for r in d for x in d[r] if "iPhone" in x["name"]))')
          # -b boots the device if needed and waits until it has finished.
          xcrun simctl bootstatus "$UDID" -b
          flutter test integration_test/sqlite_smoke_test.dart -d "$UDID"
